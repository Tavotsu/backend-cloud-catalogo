server:
  port: 8081

spring:
  application:
    name: catalogo
  security:
    oauth2:
      resourceserver:
        jwt:
          # URL completa para que Spring descargue las llaves de Microsoft automáticamente
          issuer-uri: https://login.microsoftonline.com/8ea291c8-4670-4598-8f0f-b5e216b5b755/v2.0
          audiences: c6445b4c-7863-42ac-a620-2fa3b5ea58d8
  datasource:
    # Variables dinámicas preparadas para Docker en AWS
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogo_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

# Nombres de exchanges, colas y routing keys centralizados (ver RabbitMQProperties)
app:
  security:
    # Segundo proveedor de login (AWS Cognito)
    cognito:
      issuer-uri: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_vZp9ZN52O}
      client-id: ${COGNITO_CLIENT_ID:348a4vr0o6i0ja8u5u7jes7tki}
  rabbitmq:
    exchanges:
      # Consume: orden creada
      ordenes-topic: "ordenes.topic.exchange"
      # Dead letter exchange propio de este microservicio
      dlx: "catalogo.dlx.exchange"
    queues:
      stock: "catalogo.stock.queue"
      stock-dlq: "catalogo.stock.dlq"
    routing-keys:
      # '#' acepta orden.creada y cualquier sub-clave (orden.creada.xxx)
      orden-creada: "orden.creada.#"
      stock-dlq: "catalogo.stock.dlq.key"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://3.213.91.126}
